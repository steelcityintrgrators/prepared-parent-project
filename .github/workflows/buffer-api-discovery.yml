name: Buffer API Discovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/buffer-api-discovery.yml'
      - 'scripts/buffer_publish.py'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate queue safety gates
        run: python scripts/buffer_publish.py --queue-only
      - name: Authenticate to Buffer and discover channels
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/buffer_publish.py --discover
      - name: Publish controlled social proof test
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/buffer_publish.py --verify-posts 6ad9aa63deacf5d2533214de 6ad9aa6e282deeeeb2d0a9b3 6ad9aa70b086d40f57380e2a
