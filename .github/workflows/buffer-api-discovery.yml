name: Buffer Connection Discovery (No Publishing)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate queue safety gates
        run: python scripts/buffer_publish.py --queue-only
      - name: Authenticate to Buffer and discover required channels
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python scripts/buffer_publish.py --discover | tee buffer-discovery.txt
          grep -q '"service": "facebook"' buffer-discovery.txt
          grep -q '"service": "instagram"' buffer-discovery.txt
          grep -q '"service": "youtube"' buffer-discovery.txt
      - name: Record non-publishing discovery evidence
        run: |
          printf '%s\n'             'This workflow validates queue gates, Buffer authentication, and required channel discovery.'             'It does not create, schedule, modify, or publish any social post.'             > BUFFER_DISCOVERY_SCOPE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: buffer-connection-discovery
          path: |
            buffer-discovery.txt
            BUFFER_DISCOVERY_SCOPE.txt
          if-no-files-found: error
          retention-days: 30
