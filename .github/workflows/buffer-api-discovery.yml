name: Buffer API Discovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/buffer-api-discovery.yml'
      - 'scripts/buffer_publish.py'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate queue safety gates
        run: python scripts/buffer_publish.py --queue-only
      - name: Authenticate to Buffer and discover channels
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/buffer_publish.py --discover
      - name: Publish corrected PP-008 replacement to Facebook Instagram and YouTube
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: >
          python scripts/buffer_publish.py
          --publish-asset https://steelcityintrgrators.github.io/prepared-parent-project/media/PP-008-SHORT.mp4?v=377ba499
          --asset-kind video
          --targets facebook,instagram,youtube
          --text "Could your family find important information during an emergency? Keep key contacts, medications and allergies organized. Add school and child-care contacts plus two family meeting places. Store the information securely and review it every 6 months. Planning resource: https://www.ready.gov/plan #PreparedParent #FamilyPreparedness #AlabamaFamilies"
