name: Convert Prepared Parent Media

on:
  workflow_dispatch:
  push:
    paths:
      - 'media/source/**'
      - 'scripts/convert_media.py'
      - '.github/workflows/convert-media.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install media engine
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Convert all source media
        run: |
          set -e
          mkdir -p media/generated
          shopt -s nullglob
          for f in media/source/*; do
            base="$(basename "$f")"
            id="${base%.*}"
            ext="${base##*.}"
            case "${ext,,}" in
              jpg|jpeg|png|webp) kind=image ;;
              mp4|mov|m4v|webm) kind=video ;;
              *) echo "Skipping unsupported source: $f"; continue ;;
            esac
            python scripts/convert_media.py "$f" --id "$id" --kind "$kind"
          done
      - name: Validate generated media
        run: |
          find media/generated -type f \( -name '*.jpg' -o -name '*.mp4' \) -print -exec ffprobe -v error {} \;
      - name: Publish generated derivatives safely
        run: |
          git config user.name "prepared-parent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media/generated
          if git diff --cached --quiet; then
            echo "No generated media changes to publish."
            exit 0
          fi
          git commit -m "Generate platform-ready media derivatives"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race detected; retrying safely (attempt $attempt/4)."
            sleep $((attempt * 3))
          done
          echo "Unable to publish generated derivatives after safe retries." >&2
          exit 1
      - name: Upload conversion bundle
        uses: actions/upload-artifact@v4
        with:
          name: prepared-parent-converted-media
          path: media/generated
          if-no-files-found: warn
          retention-days: 14
