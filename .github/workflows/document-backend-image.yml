name: Build Prepared Parent Document Review Container

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/document-backend-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable container
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/steelcityintrgrators/prepared-parent-document-review:latest
            ghcr.io/steelcityintrgrators/prepared-parent-document-review:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/steelcityintrgrators/prepared-parent-project
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Prepared Parent Document Review API
