name: Publish Prepared Parent READY Content

on:
  push:
    paths:
      - 'publish-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepared-parent-social-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve selected content
        run: |
          CONTENT_ID="$(head -n 1 publish-trigger.txt | tr -d '\r\n\t ')"
          test -n "$CONTENT_ID"
          echo "CONTENT_ID=$CONTENT_ID" >> "$GITHUB_ENV"

      - name: Recheck publication gates and hosted asset
        run: |
          python scripts/buffer_publish.py --queue-only --content-id "$CONTENT_ID"
          python - <<'PY'
          import json, os
          q=json.load(open("data/publishing-queue.json"))
          r=next((x for x in q["records"] if x.get("id")==os.environ["CONTENT_ID"]),None)
          assert r, "content record not found"
          assert r.get("publishGate")=="READY", r.get("publishGate")
          assert r.get("assetStatus")=="READY", r.get("assetStatus")
          assert r.get("visualQA",{}).get("status")=="PASSED", "visual QA not passed"
          import urllib.request
          url=r["assetUrl"]
          req=urllib.request.Request(url, headers={"Range":"bytes=0-15","User-Agent":"PreparedParentPublisher/1.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              data=response.read(16)
              assert data, "hosted asset returned no bytes"
              assert response.status in (200,206), response.status
          PY

      - name: Publish selected READY content
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          mkdir -p proof
          python scripts/buffer_publish.py \
            --publish \
            --content-id "$CONTENT_ID" \
            --output proof/publish-results.json

      - name: Write durable publishing lock
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          qpath=Path("data/publishing-queue.json")
          q=json.loads(qpath.read_text())
          pub=json.load(open("proof/publish-results.json"))
          rec=next(x for x in q["records"] if x.get("id")==os.environ["CONTENT_ID"])
          record=next(x for x in pub["records"] if x.get("contentId")==os.environ["CONTENT_ID"])
          ids=[]
          for item in record["posts"]:
              post=(item.get("result") or {}).get("post") or {}
              if post.get("id"):
                  ids.append({"service":item.get("service"),"channel":item.get("channel"),"postId":post["id"],"status":post.get("status"),"externalLink":post.get("externalLink")})
          assert ids, "Buffer accepted no posts"
          rec["publishGate"]="PUBLISHING"
          rec["publicationStatus"]="PUBLISHING"
          rec["publishedAt"]=pub["publishedAt"]
          rec["bufferPosts"]=ids
          rec["reason"]="Buffer accepted the approved posts. Live-link verification is in progress; this PUBLISHING lock prevents duplicate retries."
          qpath.write_text(json.dumps(q,indent=2)+"\n")
          PY
          git config user.name "prepared-parent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/publishing-queue.json
          git commit -m "Lock $CONTENT_ID while social posts verify"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Verify live posts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python - <<'PY' > /tmp/post_ids
          import json
          j=json.load(open("proof/publish-results.json"))
          ids=[]
          for record in j.get("records",[]):
              for item in record.get("posts",[]):
                  post=(item.get("result") or {}).get("post") or {}
                  if post.get("id"): ids.append(post["id"])
          assert ids, "no post IDs returned"
          print(" ".join(ids))
          PY
          IDS="$(cat /tmp/post_ids)"
          verified=0
          for attempt in $(seq 1 20); do
            python scripts/buffer_publish.py --verify-posts $IDS --output proof/verify-results.json
            if python - <<'PY'
          import json, sys
          posts=json.load(open("proof/verify-results.json"))
          ok=bool(posts) and all(
              p and p.get("externalLink")
              and not p.get("lookupError")
              and not ((p.get("error") or {}).get("message"))
              for p in posts
          )
          sys.exit(0 if ok else 1)
          PY
            then
              verified=1
              break
            fi
            sleep 15
          done
          test "$verified" = "1"

      - name: Record verified live publication
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          content_id=os.environ["CONTENT_ID"]
          pub=json.load(open("proof/publish-results.json"))
          verified=json.load(open("proof/verify-results.json"))
          by_id={x.get("id"):x for x in verified if x and x.get("id")}
          record=next(x for x in pub["records"] if x.get("contentId")==content_id)
          live=[]
          for item in record["posts"]:
              post=(item.get("result") or {}).get("post") or {}
              v=by_id.get(post.get("id"),{})
              live.append({
                  "service":item.get("service"),
                  "channel":item.get("channel"),
                  "postId":post.get("id"),
                  "status":v.get("status") or post.get("status"),
                  "url":v.get("externalLink") or post.get("externalLink")
              })
          assert live and all(x.get("url") for x in live), live

          qpath=Path("data/publishing-queue.json")
          q=json.loads(qpath.read_text())
          rec=next(x for x in q["records"] if x.get("id")==content_id)
          rec["publishGate"]="VERIFIED_LIVE"
          rec["publicationStatus"]="VERIFIED_LIVE"
          rec["publishedAt"]=pub["publishedAt"]
          rec["livePosts"]=live
          rec["reason"]="Published through the queue-gated Buffer workflow and verified live by post lookup."

          logpath=Path("data/publication-log.json")
          log=json.loads(logpath.read_text()) if logpath.exists() else {"version":"1.0.0","publications":[]}
          log["publications"].append({
              "contentId":content_id,
              "publishedAt":pub["publishedAt"],
              "sourceUrl":record.get("sourceUrl"),
              "assetUrl":record.get("assetUrl"),
              "posts":live,
              "verification":"VERIFIED_LIVE"
          })
          qpath.write_text(json.dumps(q,indent=2)+"\n")
          logpath.write_text(json.dumps(log,indent=2)+"\n")
          PY
          git add data/publishing-queue.json data/publication-log.json
          git commit -m "Record verified live publication for $CONTENT_ID"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Upload publication proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepared-parent-live-publication-proof
          path: proof/
          if-no-files-found: warn
          retention-days: 90
