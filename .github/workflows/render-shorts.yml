name: Render Prepared Parent Shorts

on:
  workflow_dispatch:
  push:
    paths:
      - 'video/briefs/**.json'
      - 'scripts/render_short.py'
      - '.github/workflows/render-shorts.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Render publication-eligible shorts
        run: |
          mkdir -p output
          for f in video/briefs/*.json; do
            python scripts/render_short.py "$f"
          done
      - name: Publish rendered media to site
        run: |
          mkdir -p media
          cp output/PP-008-SHORT.mp4 media/PP-008-SHORT.mp4
          git config user.name "prepared-parent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media/PP-008-SHORT.mp4
          git diff --cached --quiet || git commit -m "Publish PP-008 social media asset"
          git push
      - name: Upload rendered videos
        uses: actions/upload-artifact@v4
        with:
          name: prepared-parent-shorts
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 14
