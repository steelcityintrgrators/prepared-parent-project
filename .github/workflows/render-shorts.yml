name: Render Prepared Parent Shorts

on:
  workflow_dispatch:
  push:
    paths:
      - 'video/briefs/**.json'
      - 'scripts/render_short.py'
      - '.github/workflows/render-shorts.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Render publication-eligible shorts
        run: |
          mkdir -p output
          for f in video/briefs/*.json; do
            python scripts/render_short.py "$f"
          done
      - name: Upload rendered videos
        uses: actions/upload-artifact@v4
        with:
          name: prepared-parent-shorts
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 14
