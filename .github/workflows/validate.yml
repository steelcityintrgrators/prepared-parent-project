name: Validate Prepared Parent site
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files
        run: |
          test -f index.html
          test -f resources.html
          test -f disclaimer.html
          test -f learn.html
          test -f document-review.html
          test -f assets/styles.css
          test -f assets/app.js
          test -f data/resource-paths.json
          test -f data/alabama-authority-matrix.csv
          test -f data/content-library.json
          test -f data/publishing-queue.json
          test -f data/brand-system.json
          test -f data/audio-license-policy.json
          test -f data/publication-log.json
          test -f assets/runtime-config.js
          test -f assets/document-review.js
          test -f backend/server.js
          test -f backend/package.json
          test -f docs/BUFFER_PUBLISHING_INTEGRATION.md
          test -f docs/EXECUTION_BACKLOG.md
      - name: Verify non-law-firm disclaimer
        run: |
          grep -qi "not a law firm" index.html
          grep -qi "not legal advice" disclaimer.html
      - name: Validate JSON
        run: |
          python -m json.tool data/resource-paths.json >/dev/null
          python -m json.tool data/content-library.json >/dev/null
          python -m json.tool data/publishing-queue.json >/dev/null
          python -m json.tool data/brand-system.json >/dev/null
          python -m json.tool data/audio-license-policy.json >/dev/null
          python -m json.tool data/publication-log.json >/dev/null
      - name: Enforce canonical brand palette
        run: |
          python - <<'PY'
          import json
          brand=json.load(open("data/brand-system.json"))
          css=open("assets/styles.css").read().lower()
          for key in ("navy","green","gold","ink","paper"):
              value=brand["colors"][key]["hex"].lower()
              assert value in css, f"{key} {value} missing from website CSS"
          renderer=open("scripts/render_short.py").read()
          assert 'data"/"brand-system.json' in renderer, "renderer is not consuming canonical brand system"
          print("Canonical brand palette validation passed")
          PY
      - name: Enforce media rights and responsive photo layout
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          policy=json.load(open("data/audio-license-policy.json"))
          brief=json.load(open("video/briefs/PP-008.json"))
          mode=(brief.get("audio") or {}).get("mode","NONE")
          assert mode in policy["allowedModes"], f"Unsupported audio mode: {mode}"
          rule=policy["allowedModes"][mode]
          assert rule.get("publishable"), f"Audio mode is not publishable: {mode}"
          if rule.get("externalLicenseRequired"):
              missing=[k for k in rule.get("requiredFields",[]) if not brief["audio"].get(k)]
              assert not missing, f"Missing audio provenance fields: {missing}"
              assert Path(brief["audio"]["file"]).exists(), "Licensed audio file missing"
          css=Path("assets/brand-media.css").read_text()
          assert "object-fit:contain" in css, "Brand media must preserve full photo/art composition"
          assert "max-height:none" in css, "Learning Library media crop guard missing"
          print("Media-rights and responsive-photo validation passed")
          PY
      - name: Enforce Document Review safety language
        run: |
          grep -qi "not a law firm" document-review.html
          grep -qi "does not tell you what you are legally required to file" document-review.html
          grep -qi "fail-closed rule" document-review.html
          grep -qi "No file is transmitted until" document-review.html
          grep -q "secureDocumentReview" assets/runtime-config.js
          grep -q "X-Review-Token" assets/document-review.js
          grep -q "LEGAL REVIEW REQUIRED" assets/document-review.js
      - name: Check public site for prohibited law-firm positioning
        run: |
          # Policy documentation intentionally names prohibited phrases; only public-facing site copy is scanned.
          ! grep -RniE "our attorneys|our legal team|legal consultation|case evaluation|we represent you" --include='*.html' .
      - name: Enforce publishing gates
        run: |
          python - <<'PY'
          import json, sys
          q=json.load(open("data/publishing-queue.json"))
          bad=[]
          for r in q.get("records",[]):
              if r.get("publishGate")=="READY" and r.get("contentType")=="alabama-legal" and r.get("verificationStatus")!="VERIFIED — ALABAMA AUTHORITY COMPLETE":
                  bad.append(r.get("id"))
              if r.get("publishGate")=="READY" and not r.get("sourceUrl"):
                  bad.append(r.get("id"))
          if bad:
              print("Unsafe READY publishing records:", sorted(set(bad)))
              sys.exit(1)
          print("Publishing gate validation passed")
          PY
      - name: Prevent connection discovery from publishing
        run: |
          ! grep -q -- '--publish-asset' .github/workflows/buffer-api-discovery.yml
          ! grep -Eq -- 'scripts/buffer_publish.py[[:space:]]+--publish([[:space:]]|$)' .github/workflows/buffer-api-discovery.yml
      - name: Enforce truthful pre-publish proof scope
        run: |
          grep -q '"publicationAttempted":false' .github/workflows/end-to-end-proof.yml
          grep -q '"livePostVerification":"NOT_RUN"' .github/workflows/end-to-end-proof.yml
          grep -q '"analyticsFeedback":"NOT_RUN"' .github/workflows/end-to-end-proof.yml
          grep -q '"visualHumanReview":"NOT_RUN"' .github/workflows/end-to-end-proof.yml
