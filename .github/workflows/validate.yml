name: Validate Prepared Parent site
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files
        run: |
          test -f index.html
          test -f resources.html
          test -f disclaimer.html
          test -f learn.html
          test -f assets/styles.css
          test -f assets/app.js
          test -f data/resource-paths.json
          test -f data/alabama-authority-matrix.csv
          test -f data/content-library.json
          test -f data/publishing-queue.json
          test -f docs/BUFFER_PUBLISHING_INTEGRATION.md
      - name: Verify non-law-firm disclaimer
        run: |
          grep -qi "not a law firm" index.html
          grep -qi "not legal advice" disclaimer.html
      - name: Validate JSON
        run: |
          python -m json.tool data/resource-paths.json >/dev/null
          python -m json.tool data/content-library.json >/dev/null
          python -m json.tool data/publishing-queue.json >/dev/null
      - name: Check for prohibited law-firm positioning
        run: |
          ! grep -RniE "our attorneys|our legal team|legal consultation|case evaluation|we represent you" --include='*.html' --include='*.md' . 

      - name: Enforce publishing gates
        run: |
          python - <<'PY'
          import json, sys
          q=json.load(open("data/publishing-queue.json"))
          bad=[]
          for r in q.get("records",[]):
              if r.get("publishGate")=="READY" and r.get("contentType")=="alabama-legal" and r.get("verificationStatus")!="VERIFIED — ALABAMA AUTHORITY COMPLETE":
                  bad.append(r.get("id"))
              if r.get("publishGate")=="READY" and not r.get("sourceUrl"):
                  bad.append(r.get("id"))
          if bad:
              print("Unsafe READY publishing records:", sorted(set(bad)))
              sys.exit(1)
          print("Publishing gate validation passed")
          PY
